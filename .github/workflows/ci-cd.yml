name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Analisis de codigo
  # ============================================
  lint:
    name: Lint y analisis de codigo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas de lint
        run: python -m pip install --upgrade pip black flake8 isort

      - name: Ejecutar Black (solo aviso)
        working-directory: ./src/backend
        run: black . --check || true

      - name: Ejecutar Flake8 (solo aviso)
        working-directory: ./src/backend
        run: flake8 . --max-line-length=100 || true

  # ============================================
  # Tests unitarios
  # ============================================
  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 20s
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/backend/requirements.txt
          python -m pip install pytest pytest-cov httpx requests

      - name: Ejecutar Tests unitarios con cobertura
        env:
          MONGO_URI: mongodb://admin:password@localhost:27017/
        run: python -m pytest tests/unit --cov=src/backend --cov-report=xml --cov-report=term-missing -v

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ============================================
  # Build de contenedores
  # ============================================
  build:
    name: Build de imagenes Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: false
          tags: newsradar-backend:test

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: false
          tags: newsradar-frontend:test

  # ============================================
  # Resumen
  # ============================================
  summary:
    name: Resumen del Pipeline
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()

    steps:
      - name: Resumen de ejecucion
        run: |
          echo "### Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint**: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY