name: CI/CD Pipeline

# Triggers del pipeline
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Análisis de código y dependencias
  # ============================================
  lint:
    name: Lint y análisis de código
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar herramientas de lint
        run: |
          python -m pip install black flake8 isort mypy
      
      - name: Ejecutar Black
        run: black src/backend --check
      
      - name: Ejecutar Flake8
        run: flake8 src/backend --max-line-length=100

  # ============================================
  # Tests unitarios y funcionales
  # ============================================
  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0-alpine
        options: >-
          --health-cmd "mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install -r src/backend/requirements-dev.txt

      - name: Pruebas unitarias - Health Check
        run: python -m pytest tests/unit/test_health.py -v

      - name: Pruebas unitarias - Todas
        run: python -m pytest tests/unit -v

      - name: Pruebas funcionales
        run: python -m pytest tests/functional -v || true

      - name: Generar reporte de cobertura
        run: |
          python -m pytest tests/ \
            --cov=src/backend \
            --cov-report=xml \
            --cov-report=term-missing \
            || true

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ============================================
  # Build de contenedores
  # ============================================
  build:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: test
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: false
          tags: newsradar-backend:${{ github.sha }}

      - name: Build frontend
        uses: docker/build-push-action@v4
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: false
          tags: newsradar-frontend:${{ github.sha }}

  # ============================================
  # Health check de la API
  # ============================================
  health-check:
    name: Health Check de la API
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt

      - name: Iniciar API
        run: |
          cd src/backend
          python main.py &
          cd ../..
          sleep 5

      - name: Test del endpoint /health
        run: |
          python -c "
          import requests
          import time
          
          for i in range(10):
              try:
                  response = requests.get('http://localhost:8000/health')
                  if response.status_code == 200:
                      print('✓ API Health Check: OK')
                      exit(0)
              except:
                  time.sleep(1)
          
          print('✗ API Health Check: FAILED')
          exit(1)
          "

  # ============================================
  # Resumen y notificación
  # ============================================
  summary:
    name: Resumen del Pipeline
    runs-on: ubuntu-latest
    needs: [lint, test, build, health-check]
    if: always()
    
    steps:
      - name: Resumen de ejecución
        run: |
          echo "### 🔄 Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint**: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY
